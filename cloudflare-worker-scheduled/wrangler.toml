name = "arabikids-scheduled"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Two cron triggers, one Worker - dispatched by event.cron inside
# scheduled() (see src/index.js). Cloudflare Pages has no cron-trigger
# support at all, so these two jobs (ported from the Netlify Scheduled
# Functions send-streak-reminders.js / compute-affiliate-commissions.js)
# live here instead, as a small standalone Worker deployed separately from
# the Pages project (`npm run deploy` in this directory, or `wrangler
# deploy` directly).
[triggers]
crons = ["0 17 * * *", "0 3 1 * *"]

# Secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY, VAPID_PRIVATE_KEY_JWK,
# VAPID_SUBJECT) are NOT set here - `wrangler.toml` is committed to the
# repo. Set them once via `wrangler secret put <NAME>` (see this repo's
# migration notes) so they're stored encrypted in Cloudflare, not in source.
